name: Inspect unified deploy permissions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-unified.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect target permissions
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${OCI_USER}@${OCI_HOST}" '
            set -x
            id
            stat -c "%U %G %a %n" /var/www/ichirikutoku /home/deployquiz || true
            ls -ld /var/www/ichirikutoku /home/deployquiz || true
            sudo -n -l || true
            sed -n "1,240p" /usr/local/sbin/deploy-ichirikutoku 2>/dev/null || true
          '
