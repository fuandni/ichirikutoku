
name: Validate and deploy quiz

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ichirikutoku-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate question data
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("index.html")
          if not p.is_file():
              raise SystemExit("index.html がありません")

          text = p.read_text(encoding="utf-8")

          marker = "const Q="
          start = text.find(marker)
          if start < 0:
              raise SystemExit("const Q= が見つかりません")

          start += len(marker)
          end = text.find("];", start)
          if end < 0:
              raise SystemExit("問題配列の終端が見つかりません")

          raw = text[start:end+1]
          q = json.loads(raw)

          if len(q) != 75:
              raise SystemExit(
                  f"問題数が75ではありません: {len(q)}"
              )

          ids = [x.get("id") for x in q]
          if len(ids) != len(set(ids)):
              raise SystemExit("問題IDが重複しています")

          errors = []
          non_tf_count = 0
          for i, item in enumerate(q, start=1):
              qid = item.get("id") or f"#index-{i}"

              if not isinstance(item.get("id"), str) or not item["id"].strip():
                  errors.append(f"{qid}: id が空です")

              stem = item.get("stemText")
              if not isinstance(stem, str) or not stem.strip():
                  errors.append(f"{qid}: stemText が空です")

              choices = item.get("choices")
              choice_texts = item.get("choiceTexts")
              if not isinstance(choices, int) or choices < 2:
                  errors.append(f"{qid}: choices が不正です: {choices!r}")
              if not isinstance(choice_texts, list):
                  errors.append(f"{qid}: choiceTexts が配列ではありません")
              elif isinstance(choices, int) and len(choice_texts) != choices:
                  errors.append(
                      f"{qid}: choices={choices} に対して choiceTexts={len(choice_texts)}"
                  )
              elif any(not isinstance(x, str) or not x.strip() for x in choice_texts):
                  errors.append(f"{qid}: 空の選択肢があります")

              answer = item.get("answer")
              if (
                  not isinstance(answer, int)
                  or not isinstance(choices, int)
                  or answer < 1
                  or answer > choices
              ):
                  errors.append(f"{qid}: answer が選択肢範囲外です: {answer!r}")

              explanation = item.get("explanation")
              if not isinstance(explanation, str) or not explanation.strip():
                  errors.append(f"{qid}: explanation が空です")

              solve_mode = item.get("solveMode")
              if solve_mode not in {"calculation", "text"}:
                  errors.append(f"{qid}: solveMode が不正です: {solve_mode!r}")

              compact = "".join((stem or "").split())
              is_tf = (
                  "このうち正しいもの" in compact
                  or "このうち誤っているもの" in compact
              )

              reasons = item.get("choiceReasons")
              if not is_tf:
                  non_tf_count += 1
                  if not isinstance(reasons, list):
                      errors.append(f"{qid}: 非正誤問題なのに choiceReasons がありません")
                  elif isinstance(choice_texts, list) and len(reasons) != len(choice_texts):
                      errors.append(
                          f"{qid}: choiceReasons={len(reasons)} / choiceTexts={len(choice_texts)}"
                      )
                  elif any(not isinstance(x, str) or not x.strip() for x in reasons):
                      errors.append(f"{qid}: 空の choiceReason があります")
              elif isinstance(reasons, list):
                  if isinstance(choice_texts, list) and len(reasons) != len(choice_texts):
                      errors.append(
                          f"{qid}: choiceReasons={len(reasons)} / choiceTexts={len(choice_texts)}"
                      )

          if non_tf_count != 60:
              errors.append(f"非正誤問題数が60ではありません: {non_tf_count}")

          forbidden = [
              "個別解説データ未登録",
              "本文は原文画像で確認してください",
              "選択肢 1（原文画像を参照）",
          ]
          for token in forbidden:
              if token in text:
                  errors.append(f"仮置き文が残っています: {token}")

          if errors:
              raise SystemExit(
                  "問題データ検証エラー:\n- " + "\n- ".join(errors)
              )

          print(
              f"Question validation OK: {len(q)} questions, "
              f"{non_tf_count} non-TF questions"
          )
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              flags=re.I | re.S
          )

          if not scripts:
              raise SystemExit("script要素が見つかりません")

          Path("/tmp/quiz.js").write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )

          print(f"Extracted {len(scripts)} script block(s)")
          PY

          node --check /tmp/quiz.js

      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            index.html \
            "${OCI_USER}@${OCI_HOST}:/home/deployquiz/index.html.upload"

      - name: Deploy
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "${OCI_USER}@${OCI_HOST}" \
            'sudo /usr/local/sbin/deploy-ichirikutoku'

      - name: Verify deployed file
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          LOCAL_SHA="$(sha256sum index.html | awk '{print $1}')"

          REMOTE_SHA="$(
            ssh \
              -i ~/.ssh/id_ed25519 \
              "${OCI_USER}@${OCI_HOST}" \
              "sha256sum /var/www/ichirikutoku/index.html | awk '{print \$1}'"
          )"

          echo "Local : $LOCAL_SHA"
          echo "Remote: $REMOTE_SHA"

          test "$LOCAL_SHA" = "$REMOTE_SHA"

      - name: Verify web service
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 2 \
            "https://${OCI_HOST}/health"