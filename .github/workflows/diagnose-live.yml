name: Diagnose live access
on:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose-live.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Diagnose
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -e
          echo "=== external ==="
          for u in "https://${OCI_HOST}/home/" "https://${OCI_HOST}/home/index.html"; do
            echo "$u"; curl -k -sS -o /dev/null -w '%{http_code} %{url_effective}\n' "$u" || true
          done
          echo "=== server local ==="
          ssh -i ~/.ssh/id_ed25519 "${OCI_USER}@${OCI_HOST}" '
            for u in https://127.0.0.1/home/ https://127.0.0.1/home/index.html; do
              echo "$u"; curl -k -sS -o /dev/null -w "%{http_code} %{url_effective}\\n" -H "Host: ichirikutoku.duckdns.org" "$u" || true
            done
            ls -ldZ /var/www/ichirikutoku /var/www/ichirikutoku/home
            ls -lZ /var/www/ichirikutoku/home/index.html
          '
