name: Inspect remaining quiz questions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Compare current answers with deployed questions
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${OCI_USER}@${OCI_HOST}" 'python3 -' <<'PY'
          import json, sqlite3
          from pathlib import Path

          html=Path("/var/www/ichirikutoku/index.html").read_text(encoding="utf-8")
          marker="const Q="
          start=html.index(marker)+len(marker)
          end=html.index("];", start)+1
          questions=json.loads(html[start:end])

          con=sqlite3.connect("/opt/ichirikutoku/data/progress.db")
          row=con.execute("select db_json from state where id=1").fetchone()
          con.close()
          db=json.loads(row[0]) if row and row[0] else {"mastery":{}}
          mastery=db.get("mastery") or {}

          correct=[]
          wrong=[]
          unanswered=[]
          for q in questions:
              m=mastery.get(q["id"])
              if not m or m.get("lastChoice") is None:
                  unanswered.append(q["id"])
              elif int(m["lastChoice"])==int(q["answer"]):
                  correct.append(q["id"])
              else:
                  wrong.append(q["id"])

          print("TOTAL",len(questions))
          print("CORRECT",len(correct))
          print("WRONG",len(wrong))
          print("UNANSWERED",len(unanswered))
          print("REMAINING",len(wrong)+len(unanswered))
          print("CORRECT_IDS",json.dumps(correct,ensure_ascii=False))
          print("REMAINING_IDS",json.dumps(wrong+unanswered,ensure_ascii=False))
          PY
