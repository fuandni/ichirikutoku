name: Inspect quiz progress schema

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect progress database schema
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${OCI_USER}@${OCI_HOST}" 'bash -s' <<'REMOTE'
          set -eu
          DB=/opt/ichirikutoku/data/progress.db
          echo "=== tables ==="
          sqlite3 "$DB" '.tables'
          echo "=== schema ==="
          sqlite3 "$DB" '.schema'
          echo "=== row counts ==="
          for t in $(sqlite3 "$DB" "select name from sqlite_master where type='table' and name not like 'sqlite_%';"); do
            printf '%s: ' "$t"
            sqlite3 "$DB" "select count(*) from \"$t\";"
          done
          REMOTE
