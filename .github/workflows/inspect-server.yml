name: Inspect sync backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "=== ACTIONS PUBLIC KEY ==="
          ssh-keygen -y -f ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -t ed25519 "$OCI_HOST" > /tmp/oci_ed25519
          ACTUAL="$(ssh-keygen -lf /tmp/oci_ed25519 -E sha256 | awk '{print $2}')"
          EXPECTED="SHA256:WGNqmz/giwW4QexkH1gE+9UJ0t7nQmyPXrH/Bbf5gow"
          echo "OCI host key fingerprint: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          cp /tmp/oci_ed25519 ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect backend safely
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "opc@${OCI_HOST}" 'bash -s' <<'REMOTE'
          set -e
          echo "=== HOST ==="
          hostname
          echo "=== SERVICES ==="
          systemctl is-active nginx || true
          systemctl is-active ichirikutoku || true
          echo "=== JOURNAL ==="
          sudo journalctl -u ichirikutoku -n 100 --no-pager 2>/dev/null || true
          echo "=== UNIT ==="
          sudo systemctl cat ichirikutoku 2>/dev/null | sed -E "s/(Environment=|PASSWORD|SECRET|TOKEN).*/[redacted]/Ig" || true
          echo "=== OPT TREE ==="
          sudo find /opt/ichirikutoku -maxdepth 3 -type f -printf "%p\n" 2>/dev/null | sort || true
          echo "=== PYTHON SOURCES ==="
          while IFS= read -r f; do
            echo "--- $f ---"
            sudo sed -E "s/((PASSWORD|SECRET|TOKEN|KEY)[A-Za-z0-9_]*[[:space:]]*=[[:space:]]*).*/\\1[redacted]/Ig" "$f"
          done < <(sudo find /opt/ichirikutoku -maxdepth 3 -type f \( -name "*.py" -o -name "*.js" \) 2>/dev/null | sort)
          echo "=== DEPLOY SCRIPT ==="
          sudo cat /usr/local/sbin/deploy-ichirikutoku 2>/dev/null || true
          echo "=== NGINX ICHIRIKUTOKU ==="
          sudo nginx -T 2>/dev/null | sed -n '/server_name .*152\.69\.205\.67/,/^[[:space:]]*}/p' | head -220 || true
          echo "=== SQLITE SCHEMA ==="
          if [ -f /opt/ichirikutoku/data/progress.db ]; then
            python3 - <<'PY'
          import sqlite3
          p="/opt/ichirikutoku/data/progress.db"
          con=sqlite3.connect(p)
          for row in con.execute("select name, sql from sqlite_master where type in ('table','index') order by type,name"):
              print(row[0], row[1])
          con.close()
          PY
          fi
          REMOTE
