name: Inspect quiz progress schema

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect progress database schema
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${OCI_USER}@${OCI_HOST}" 'python3 -' <<'PY'
          import sqlite3
          db="/opt/ichirikutoku/data/progress.db"
          con=sqlite3.connect(db)
          cur=con.cursor()
          print("=== schema ===")
          rows=cur.execute("select name, sql from sqlite_master where type='table' order by name").fetchall()
          for name,sql in rows:
              print(name)
              print(sql)
          print("=== row counts ===")
          for name,_ in rows:
              if name.startswith("sqlite_"):
                  continue
              n=cur.execute(f'SELECT COUNT(*) FROM "{name}"').fetchone()[0]
              print(f"{name}: {n}")
          con.close()
          PY
