name: Inspect nginx routing
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-nginx.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Inspect nginx
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${OCI_USER}@${OCI_HOST}" '
            echo "=== nginx.conf ==="
            cat /etc/nginx/nginx.conf 2>/dev/null || true
            echo "=== conf.d ==="
            for f in /etc/nginx/conf.d/*.conf; do echo "--- $f"; cat "$f"; done 2>/dev/null || true
            echo "=== default.d ==="
            for f in /etc/nginx/default.d/*.conf; do echo "--- $f"; cat "$f"; done 2>/dev/null || true
            echo "=== perms ==="
            namei -l /var/www/ichirikutoku/home/index.html || true
          '
