name: Deploy unified study site

on:
  push:
    branches:
      - main
    paths:
      - "ichirikutoku_oci_unified_no198.zip"
      - ".github/workflows/deploy-unified.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ichirikutoku-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ichirikutoku_oci_unified_no198.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          z="ichirikutoku_oci_unified_no198.zip"
          required={"home/index.html","houki-textbook/index.html","houki-practice/index.html","kogaku-v1/index.html"}
          with zipfile.ZipFile(z) as f:
              raw_names={n.replace("\\","/") for n in f.namelist()}
              prefix="ichirikutoku_unified/"
              names={n[len(prefix):] if n.startswith(prefix) else n for n in raw_names}
              names={n.lstrip("./") for n in names}
              unsafe=[]
              for n in names:
                  p=PurePosixPath(n)
                  if p.is_absolute() or ".." in p.parts:
                      unsafe.append(n)
              if unsafe:
                  raise SystemExit("Unsafe ZIP paths: "+", ".join(unsafe[:10]))
              missing=required-names
              if missing:
                  raise SystemExit("Missing required entries: "+", ".join(sorted(missing)))
          print("Unified package validation OK")
          PY

      - name: Prepare corrected package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unified-fix /tmp/ichirikutoku.upload.zip
          mkdir -p /tmp/unified-fix
          unzip -q ichirikutoku_oci_unified_no198.zip -d /tmp/unified-fix
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/unified-fix/ichirikutoku_unified/home/index.html")
          s=p.read_text(encoding="utf-8")
          replacements={
              'href="houki-textbook/index.html"':'href="/houki-textbook/"',
              'href="houki-practice/index.html"':'href="/houki-practice/"',
              'href="kogaku-v1/index.html"':'href="/kogaku-v1/"',
              'href="kogaku-v2/index.html"':'href="/"',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected link missing: {old}")
              s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")

          # 無線工学v1: 年・試験回カードに受験済み表示を追加する。
          # 既存アプリの保存形式を壊さず、ブラウザ側で既存DOM/保存データを観察して表示する。
          q=Path("/tmp/unified-fix/ichirikutoku_unified/kogaku-v1/index.html")
          t=q.read_text(encoding="utf-8")
          addon=r'''
<style id="attempt-status-style">
.attempt-done{border:2px solid #3b82f6!important;box-shadow:0 0 0 2px rgba(59,130,246,.10) inset!important}
.attempt-score{display:block;margin-top:.35rem;padding:.2rem .45rem;border-radius:.45rem;background:rgba(59,130,246,.10);font-size:.78rem;font-weight:700;line-height:1.35}
</style>
<script id="attempt-status-script">
(()=> {
 const norm=s=>(s||"").replace(/\\s+/g,"");
 const scoreText=(obj)=>{
   if(!obj||typeof obj!=="object") return "";
   const vals=[obj.score,obj.correct,obj.correctCount,obj.right,obj.total,obj.totalCount,obj.count];
   const nums=vals.filter(v=>Number.isFinite(Number(v))).map(Number);
   let correct=Number(obj.correct??obj.correctCount??obj.right);
   let total=Number(obj.total??obj.totalCount??obj.count);
   let score=Number(obj.score);
   if(Number.isFinite(correct)&&Number.isFinite(total)&&total>0) return `${correct}/${total}（${Math.round(correct/total*100)}%）`;
   if(Number.isFinite(score)) return score<=1?`${Math.round(score*100)}%`:`${Math.round(score)}点`;
   return "";
 };
 const records=()=>{
   const out=[];
   for(let i=0;i<localStorage.length;i++){
     const k=localStorage.key(i), raw=localStorage.getItem(k);
     try{
       const v=JSON.parse(raw);
       const walk=(x,path=k)=>{
         if(!x||typeof x!=="object") return;
         if(Array.isArray(x)){x.forEach((y,j)=>walk(y,path+"."+j));return;}
         const st=scoreText(x);
         if(st) out.push({key:norm(path+" "+JSON.stringify(x)),score:st});
         Object.entries(x).forEach(([a,b])=>{if(typeof b==="object")walk(b,path+"."+a)});
       }; walk(v);
     }catch{}
   }
   return out;
 };
 const paint=()=>{
   const rec=records();
   document.querySelectorAll("button,a,.card,.exam-card,[role=button]").forEach(el=>{
     if(el.closest("#attempt-status-script")) return;
     const txt=norm(el.textContent);
     if(!txt||txt.length>80) return;
     const year=(txt.match(/(20\\d{2}|令和\\d+|平成\\d+)/)||[])[0];
     const round=(txt.match(/(?:第)?([1-9])回/)||[])[0];
     if(!year||!round) return;
     const hit=rec.find(r=>r.key.includes(norm(year))&&r.key.includes(norm(round)));
     if(!hit) return;
     el.classList.add("attempt-done");
     if(!el.querySelector(".attempt-score")){
       const b=document.createElement("span"); b.className="attempt-score"; b.textContent="受験済み "+hit.score; el.appendChild(b);
     }
   });
 };
 addEventListener("load",()=>{paint();new MutationObserver(paint).observe(document.body,{childList:true,subtree:true})});
})();
</script>
'''
          if "</body>" not in t:
              raise SystemExit("kogaku-v1 closing body not found")
          t=t.replace("</body>",addon+"</body>",1)
          q.write_text(t,encoding="utf-8")
          PY
          (cd /tmp/unified-fix && zip -qr /tmp/ichirikutoku.upload.zip ichirikutoku_unified)

      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload package
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
            /tmp/ichirikutoku.upload.zip \
            "${OCI_USER}@${OCI_HOST}:/home/deployquiz/ichirikutoku.upload.zip"

      - name: Deploy package
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${OCI_USER}@${OCI_HOST}" \
            'sudo /usr/local/sbin/deploy-ichirikutoku'

      - name: Verify deployed files
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${OCI_USER}@${OCI_HOST}" '
            set -e
            test -s /var/www/ichirikutoku/home/index.html
            test -s /var/www/ichirikutoku/houki-textbook/index.html
            test -s /var/www/ichirikutoku/houki-practice/index.html
            test -s /var/www/ichirikutoku/kogaku-v1/index.html
            test -s /var/www/ichirikutoku/index.html
            echo "Unified deployment files verified"
          '

      - name: Verify web endpoints
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          set -euo pipefail
          for path in health home/index.html houki-textbook/index.html houki-practice/index.html kogaku-v1/index.html; do
            echo "Checking /${path}"
            curl --fail --show-error --silent --output /dev/null \
              --retry 5 --retry-delay 2 \
              "https://${OCI_HOST}/${path}"
          done
          echo "Checking distinct study pages"
          curl --fail --silent "https://${OCI_HOST}/houki-textbook/index.html" -o /tmp/houki-textbook.html
          curl --fail --silent "https://${OCI_HOST}/houki-practice/index.html" -o /tmp/houki-practice.html
          curl --fail --silent "https://${OCI_HOST}/kogaku-v1/index.html" -o /tmp/kogaku-v1.html
          grep -q "一陸特 法規 混同論点の対比" /tmp/houki-textbook.html
          grep -q "一陸特 法規 演習 スマホ版" /tmp/houki-practice.html
          grep -q "一陸特 無線工学 問題集" /tmp/kogaku-v1.html
